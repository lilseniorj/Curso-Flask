{% extends "base.html" %}

{% block title %}Log in · Notes App{% endblock title %}

{% block content %}

  <div class="max-w-sm mx-auto">

    <h1 class="text-2xl font-semibold text-slate-900 mb-6 text-center">Log in</h1>

    <div class="bg-white border border-slate-200 rounded-lg p-6">
      <form method="POST" class="space-y-4">

        <div>
          <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email</label>
          <input type="email" name="email" id="email"
                 class="w-full border border-slate-300 rounded-md px-3 py-2
                        focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Password</label>
          <input type="password" name="password" id="password"
                 class="w-full border border-slate-300 rounded-md px-3 py-2
                        focus:outline-none focus:ring-2 focus:ring-slate-400">
        </div>

        <input type="submit" value="Log in"
               class="w-full bg-slate-900 text-white px-4 py-2 rounded-md
                      hover:bg-slate-700 cursor-pointer">

      </form>
    </div>

    <p class="text-sm text-slate-600 text-center mt-4">
      Don't have an account?
      <a href="{{ url_for('users.register') }}" class="text-slate-900 underline">Register</a>
    </p>

  </div>

{% endblock content %}

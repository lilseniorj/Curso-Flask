<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home page</title>
</head>
<body>
  <h1>Welcome to Flask Notes</h1>
  <ul>
    {% for note in notes %}
      {% if note.published_at and note.published_at <= now %}
        <li>
          {{ note.title }}
          <br>
          {{ note.content }}
          <a href="{{ url_for('edit_note', note_id=note.id) }}">
            Edit 📝
          </a>
          <br>
          {{ note.id }}
        </li>
      {% endif %}
    {% else %}
        Not notes yet
    {% endfor %}
  </ul>

  <a href="{{ url_for('create_note') }}">Create a new note</a>
</body>
</html>

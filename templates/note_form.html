{% extends "base.html" %}

{% block title %}New note · Notes App{% endblock title %}

{% block content %}

  <h1 class="text-2xl font-semibold text-slate-900 mb-6">Create a new note</h1>

  <div class="bg-white border border-slate-200 rounded-lg p-6">
    <form method="POST" class="space-y-4">

      <div>
        <label for="title" class="block text-sm font-medium text-slate-700 mb-1">Title</label>
        <input type="text" name="title" id="title"
               class="w-full border border-slate-300 rounded-md px-3 py-2
                      focus:outline-none focus:ring-2 focus:ring-slate-400">
      </div>

      <div>
        <label for="content" class="block text-sm font-medium text-slate-700 mb-1">Content</label>
        <textarea name="content" id="content" rows="4"
                  class="w-full border border-slate-300 rounded-md px-3 py-2
                         focus:outline-none focus:ring-2 focus:ring-slate-400"></textarea>
      </div>

      <div>
        <label for="published_at" class="block text-sm font-medium text-slate-700 mb-1">
          Publish date
        </label>
        <input type="datetime-local" name="published_at" id="published_at"
               class="w-full border border-slate-300 rounded-md px-3 py-2
                      focus:outline-none focus:ring-2 focus:ring-slate-400">
        <p class="text-xs text-slate-500 mt-1">
          Leave it empty to keep the note as a draft.
        </p>
      </div>

      <div class="flex items-center gap-3 pt-2">
        <input type="submit" value="Create note"
               class="bg-slate-900 text-white px-4 py-2 rounded-md hover:bg-slate-700 cursor-pointer">
        <a href="{{ url_for('notes.home') }}" class="text-sm text-slate-600 hover:text-slate-900">
          Cancel
        </a>
      </div>

    </form>
  </div>

{% endblock content %}
